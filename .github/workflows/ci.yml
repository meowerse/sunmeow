---
# Lean CI for sunmeow.
#
# This replaces the 24 workflows inherited from LizardByte/Sunshine. Every one of
# them either called `LizardByte/.github/.github/workflows/__call-*.yml@master`
# (which needs that organisation's Docker Hub credentials, bot accounts and
# release secrets) or published outward to winget / homebrew / flathub / copr /
# GitHub Pages under LizardByte's identity. None can succeed on a fork, and the
# publishing ones would be actively wrong if they did.
#
# What we verify instead: the thing we actually ship — that sunmeow builds on
# Arch (the maintainer's platform) and that its test suite passes.

name: CI

on:
  pull_request:
  push:
    branches:
      - sunshine-base
  workflow_dispatch:

# A newer push makes an in-flight run obsolete. Cancelling keeps the queue short.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test (Arch)
    runs-on: ubuntu-latest
    # Arch matches the maintainer's actual host (CachyOS). Testing on the distro
    # we run on catches version skew that an Ubuntu image would hide.
    container: archlinux:base-devel
    timeout-minutes: 60

    steps:
      - name: Install dependencies
        run: |
          # qt6-base/qt6-svg are needed by third-party/tray. We install them rather
          # than building with -DSUNSHINE_ENABLE_TRAY=OFF: the tray is shipped code
          # and not compiling it would be a second coverage hole alongside CUDA.
          # (This build passed locally only because the maintainer runs KDE, where
          # Qt is present anyway -- a clean container is what exposed it.)
          pacman -Syu --noconfirm --needed \
            git cmake ninja pkgconf \
            boost ffmpeg openssl opus \
            libva libdrm libcap libevdev libpulse numactl miniupnpc curl avahi \
            wayland wayland-protocols libx11 libxcb libxfixes libxrandr libxtst \
            qt6-base qt6-svg \
            nodejs npm python

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Sunshine pins `find_package(Boost CONFIG 1.89.0 EXACT)`. Arch ships a
      # newer Boost, so CMake falls back to FetchContent and *builds Boost from
      # source* — by far the slowest part of a cold build. Caching it is the
      # single biggest speed win available here.
      - name: Cache CMake dependency builds
        uses: actions/cache@v4
        with:
          path: |
            build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('cmake/dependencies/**', 'CMakeLists.txt') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Configure
        # CUDA is off: GitHub runners have no NVIDIA GPU and the toolkit is a
        # multi-GB download per run. KNOWN COVERAGE GAP -- the NVENC encode path
        # is the maintainer's real path and is NOT compiled here. It is covered
        # by the local build gate documented in CLAUDE.md, which builds with
        # -DBUILD_TESTS=ON and CUDACXX set.
        # Docs are off: doxygen >= 1.10 is required by third-party/doxyconfig
        # and is not needed to verify the code.
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON \
            -DBUILD_DOCS=OFF \
            -DSUNSHINE_ENABLE_CUDA=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      # These suites need real hardware or session services (audio devices, a
      # /dev/uinput-backed virtual HID, an encoder, a system tray). On a runner
      # they do not fail -- they HANG, which would burn the job timeout and tell
      # us nothing. They are excluded explicitly and named here so the gap is
      # visible rather than silent. They still run in the local gate on a real
      # desktop, where 398/403 pass.
      - name: Test
        working-directory: build/tests
        timeout-minutes: 15
        run: |
          # Built as a single-line variable on purpose: a backslash continuation
          # inside the filter would fold the YAML indentation into the argument.
          EXCLUDE='-AudioTest*:AVAudioTest*:ProcessSystemAudioIOProcTest*:MouseHIDTest*:InputGamepadSessionTest*:InvalidVirtualInputLicenseRequestTest*:EncoderTest*:SoftwareEncoderConversion*:SystemTrayTest*:SystemTrayDisabled*'
          echo "excluding: $EXCLUDE"
          ./test_sunshine --gtest_filter="$EXCLUDE"
