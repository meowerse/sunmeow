---
# Lean CI for sunmeow.
#
# This replaces the 24 workflows inherited from LizardByte/Sunshine. Every one of
# them either called `LizardByte/.github/.github/workflows/__call-*.yml@master`
# (which needs that organisation's Docker Hub credentials, bot accounts and
# release secrets) or published outward to winget / homebrew / flathub / copr /
# GitHub Pages under LizardByte's identity. None can succeed on a fork, and the
# publishing ones would be actively wrong if they did.
#
# What we verify instead: the thing we actually ship — that sunmeow builds on
# Arch (the maintainer's platform) and that its test suite passes.

name: CI

on:
  pull_request:
  push:
    branches:
      - sunshine-base
  workflow_dispatch:

# A newer push makes an in-flight run obsolete. Cancelling keeps the queue short.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

# ccache tuning. The cache was already being restored (confirmed in the run logs),
# but nothing measured or improved its hit rate, and the build is ~66% of CI
# wall-clock. These are the settings that matter for a containerised CI build:
#
#   depend_mode      skips the preprocessor on a hit; faster, and it stops
#                    unrelated header edits from invalidating every object.
#   compilercheck    hash the compiler's contents, not its mtime -- a pacman -Syu
#                    that reinstalls an identical gcc would otherwise miss the
#                    entire cache.
#   basedir/nohashdir  make the cache independent of the absolute build path, so
#                    a checkout at a different path still hits.
#   sloppiness       __DATE__/__TIME__ and header mtimes are not meaningful here
#                    and otherwise force misses on every run.
#   maxsize          GitHub caps total cache at 10 GB per repo; 2 G leaves room
#                    for the 259 MB _deps cache and its history.
env:
  CCACHE_DEPEND: "1"
  CCACHE_COMPILERCHECK: content
  CCACHE_NOHASHDIR: "true"
  CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,pch_defines,locale
  CCACHE_MAXSIZE: 2G

jobs:
  build-test:
    name: Build & test (Arch)
    runs-on: ubuntu-latest
    # Arch matches the maintainer's actual host (CachyOS). Testing on the distro
    # we run on catches version skew that an Ubuntu image would hide.
    container: archlinux:base-devel
    timeout-minutes: 60

    steps:
      - name: Install dependencies
        run: |
          # qt6-base/qt6-svg are needed by third-party/tray, and libpipewire by the
          # KWin and xdg-portal capture backends (linux.cmake makes libpipewire-0.3
          # REQUIRED whenever SUNSHINE_ENABLE_KWIN or _PORTAL is on -- both default
          # on, and KWin capture is the backend this project actually streams
          # through). We install them rather than switching those features off:
          # they are shipped code, and not compiling them would add coverage holes
          # alongside the documented CUDA one.
          # (The build passed locally only because the maintainer runs KDE, where
          # Qt and PipeWire are present anyway -- a clean container is what exposed
          # this. Verified by running this exact image and configure line in Docker
          # before pushing: configure exits 0.)
          pacman -Syu --noconfirm --needed \
            git cmake ninja pkgconf ccache \
            boost ffmpeg openssl opus \
            libva libdrm libcap libevdev libpulse numactl miniupnpc curl avahi \
            wayland wayland-protocols libx11 libxcb libxfixes libxrandr libxtst \
            qt6-base qt6-svg libpipewire \
            nodejs npm python python-jinja

      # `fetch-depth: 0` used to be set here, with the comment "version detection
      # reads tags". That was wrong, and it was expensive: this repository's history
      # is ~5.1 GB, and a full clone was measured at 284-332s per run -- about a
      # third of total CI wall-clock.
      #
      # `cmake/prep/build_version.cmake` never calls `git describe`. It runs exactly
      # three git commands: `rev-parse --abbrev-ref HEAD`, `rev-parse --short HEAD`,
      # and `diff -b --quiet`. All three work on a depth-1 clone. CI derived
      # `PROJECT_VERSION: 0.0.0` with the full history anyway, so nothing regressed
      # by dropping it -- there was no tag lookup to break.
      #
      # `filter: blob:none` makes this a partial clone: trees are fetched, file
      # blobs only on demand. It matters most for the submodules, of which
      # `third-party/build-deps` alone is 362 MB (nine platforms' prebuilt FFmpeg;
      # this job reads only `dist/Linux-x86_64`).
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          filter: blob:none

      # Checkout is now the largest single step (161s of a 237s run once ccache
      # is warm). Before optimising it further, measure where that time goes:
      # 400 MB over a runner's network is a few seconds, so this is git overhead
      # (16 separate submodule clones), not bandwidth. This step is cheap and
      # tells the next change what to actually cut.
      - name: Report checkout cost
        run: |
          echo "## Checkout cost" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "main .git:  $(du -sh .git 2>/dev/null | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "worktree:   $(du -sh --exclude=.git . 2>/dev/null | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "submodules: $(git submodule status --recursive 2>/dev/null | wc -l)" >> "$GITHUB_STEP_SUMMARY"
          git submodule --quiet foreach --recursive             'echo "  $(du -sh --exclude=.git . 2>/dev/null | cut -f1)  $displaypath"'             2>/dev/null | sort -rh | head -12 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      # The container runs as a different uid than the checkout owner, so git
      # refuses to touch the tree ("detected dubious ownership") and the
      # `rev-parse` calls in cmake/prep/build_version.cmake fail with error 128,
      # breaking version detection.
      - name: Trust the workspace
        run: git config --global --add safe.directory '*'

      # Sunshine pins `find_package(Boost CONFIG 1.89.0 EXACT)`. Arch ships a
      # newer Boost, so CMake falls back to FetchContent and *builds Boost from
      # source* — by far the slowest part of a cold build. Caching it is the
      # single biggest speed win available here.
      - name: Cache CMake dependency builds
        uses: actions/cache@v6
        with:
          path: |
            build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('cmake/dependencies/**', 'CMakeLists.txt') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Configure
        # CUDA is off: GitHub runners have no NVIDIA GPU and the toolkit is a
        # multi-GB download per run. KNOWN COVERAGE GAP -- the NVENC encode path
        # is the maintainer's real path and is NOT compiled here. It is covered
        # by the local build gate documented in CLAUDE.md, which builds with
        # -DBUILD_TESTS=ON and CUDACXX set.
        # Docs are off: doxygen >= 1.10 is required by third-party/doxyconfig
        # and is not needed to verify the code.
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON \
            -DBUILD_DOCS=OFF \
            -DSUNSHINE_ENABLE_CUDA=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        env:
          CCACHE_BASEDIR: ${{ github.workspace }}
        run: |
          ccache --zero-stats
          cmake --build build --parallel "$(nproc)"
          # Printed so the next person tuning CI can see the hit rate instead of
          # guessing. The cache restores (verified in the logs) but its
          # effectiveness across header changes was never measured.
          ccache --show-stats

      # These suites need real hardware or session services (a sound card, a
      # /dev/uinput-backed virtual HID, a working encoder). On a runner they do not
      # report a failing assertion -- they fail in SetUpTestSuite, which gtest counts
      # as a failed SUITE while still reporting "0 FAILED TESTS". They are named in
      # full here and the gap is deliberate; they still run in the local gate on a
      # real desktop.
      #
      # Use the FULL suite name. These are value-parameterised, so their real names
      # carry an instantiation prefix ("Configurations/AudioTest", not "AudioTest").
      # gtest_filter anchors at the start of the name, so the unprefixed patterns
      # this file used to carry matched nothing at all and the suites ran anyway --
      # which is exactly how the first green-looking build still went red.
      - name: Test
        working-directory: build/tests
        timeout-minutes: 15
        run: |
          # Built as a single-line variable on purpose: a backslash continuation
          # inside the filter would fold the YAML indentation into the argument.
          EXCLUDE='-Configurations/AudioTest*:MouseInputs/MouseHIDTest*:EncoderVariants/EncoderTest*:InputGamepadSessionTest*:SoftwareEncoderConversion*:SystemTrayTest*'
          echo "excluding: $EXCLUDE"
          ./test_sunshine --gtest_filter="$EXCLUDE"
